<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><link rel="stylesheet" href="r2.css"></head><body><div class="w"><h1 class="h">Create your library account</h1><p class="sub">You need it to reserve books online.</p>
<div class="f"><label for="c">Library card number</label><span class="hint">12 digits, on the back of your card</span><input id="c" inputmode="numeric"></div>
<div class="f"><label for="e">Email</label><input id="e" type="email" autocomplete="email"></div>
<div class="f"><label for="p">Password</label><span class="hint">At least 10 characters, including a number</span><input id="p" type="password" autocomplete="new-password"></div>
<div class="f"><label for="p2">Password again</label><input id="p2" type="password" autocomplete="new-password"></div>
<button class="btn">Create account</button><p class="small">All fields are needed. <a href="#">Terms of use</a></p></div></body></html>
