<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><link rel="stylesheet" href="r2.css"></head><body><div class="w"><h1 class="h">Create your library account</h1><p class="sub">You need it to reserve books online.</p>
<div class="f"><label for="c">Library card number</label><span class="hint">12 digits, on the back of your card</span><input id="c" inputmode="numeric" value="2930 0041 7782"></div>
<div class="f"><label for="e">Email</label><input id="e" type="email" value="sam.jones@gmial.com"></div>
<div class="f bad"><label for="p">Password</label><span class="hint">At least 10 characters, including a number</span><input id="p" type="password" value="bookworm"><div class="msg" role="alert"><span aria-hidden="true">&#9888;</span><span>This password has 8 characters and no number. Add at least 2 more characters, including a number.</span></div></div>
<div class="f"><label for="p2">Password again</label><input id="p2" type="password" autocomplete="new-password" value="bookworm"></div>
<button class="btn">Create account</button><p class="small">All fields are needed. <a href="#">Terms of use</a></p></div></body></html>
