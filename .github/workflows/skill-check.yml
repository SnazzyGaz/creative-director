name: skill-check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Skill folder is up to date with the root files
        run: python3 tools/package_skill.py --check
      - name: Prompt bundles build
        run: python3 tools/build_bundle.py --check
