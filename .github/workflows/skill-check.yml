name: skill-check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Skill folder is up to date with the root files
        run: python tools/package_skill.py --check
      - name: Prompt bundles build cleanly from manifest
        run: python tools/build_bundle.py --check
      - name: Token budgets (v2 lean kernel + modules)
        run: |
          pip install tiktoken
          python tools/check_budgets.py --loads
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tool requirements
        shell: bash
        run: |
          sed 's/^opencv-python$/opencv-python-headless/' tools/requirements.txt > req-ci.txt
          pip install -r req-ci.txt
          python -m playwright install chromium
      - name: Install playwright system deps (Linux)
        if: runner.os == 'Linux'
        run: python -m playwright install-deps chromium
      - name: Test suites
        shell: bash
        run: |
          set -e
          for t in tools/tests/cd_cases.py tools/tests/compose_cases.py tools/tests/mcp_cases.py \
                   tools/tests/autocheck_cases.py tools/tests/balance_cases.py tools/tests/ellipse_cases.py \
                   tools/tests/grid_cases.py tools/tests/intersect_cases.py tools/tests/whitespace_cases.py \
                   tools/tests/datagraphic_cases.py tools/tests/font_find_cases.py \
                   modules/lookbook/tests/score_find.py; do
            echo "== $t"
            python "$t"
          done
